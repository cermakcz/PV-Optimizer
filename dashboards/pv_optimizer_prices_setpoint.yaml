type: custom:apexcharts-card
header:
  title: PV Optimizer — Prices & Setpoint (24h)
  show: true
now:
  show: true
  label: Now
graph_span: 24h
span:
  start: hour
grid_options:
  columns: 24
apex_config:
  chart:
    height: 320
  legend:
    position: bottom
  stroke:
    curve: stepline
    width: 2
  annotations:
    yaxis:
      - "y": 0
yaxis:
  - id: price
    min: "|-1|"
    max: "|+1|"
    decimals: 3
    apex_config:
      title:
        text: CZK/kWh
  - id: setpoint
    min: "|-100|"
    max: "|+100|"
    opposite: true
    decimals: 0
    apex_config:
      title:
        text: W
series:
  - entity: sensor.pv_optimizer_buy_prices
    name: Buy price
    color: "#cb4335"
    extend_to: false
    yaxis_id: price
    show:
      legend_value: false
    data_generator: |
      const prices = (entity.attributes && entity.attributes.prices) || {};
      return Object.entries(prices).map(
        ([ts, v]) => [new Date(ts).getTime(), Number(v)]
      );
  - entity: sensor.pv_optimizer_sell_prices
    name: Sell price
    color: "#27ae60"
    extend_to: false
    yaxis_id: price
    show:
      legend_value: false
    data_generator: |
      const prices = (entity.attributes && entity.attributes.prices) || {};
      return Object.entries(prices).map(
        ([ts, v]) => [new Date(ts).getTime(), Number(v)]
      );
  - entity: sensor.pv_optimizer_plan
    name: Planned setpoint
    type: line
    color: "#2169b0"
    opacity: 0.6
    extend_to: false
    yaxis_id: setpoint
    unit: W
    show:
      legend_value: false
    data_generator: |
      return (entity.attributes.slots || []).map(
        (s) => [new Date(s.start).getTime(), Math.round(s.setpoint_w)]
      );
