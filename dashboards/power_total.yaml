type: custom:apexcharts-card
header:
  show: true
  show_states: true
  colorize_states: true
  title: Power total
now:
  show: true
  label: Now
graph_span: 24h
grid_options:
  columns: 24
span:
  start: day
apex_config:
  chart:
    height: 280
    animations:
      enabled: false
  legend:
    show: true
  stroke:
    width: 2
    curve: smooth
  fill:
    type: gradient
    gradient:
      shadeIntensity: 0.4
      opacityFrom: 0.5
      opacityTo: 0.05
      stops:
        - 0
        - 90
        - 100
  tooltip:
    x:
      format: HH:mm
yaxis:
  - min: ~0
    max: ~0
    decimals: 0
    apex_config:
      title:
        text: W
series:
  - entity: sensor.pv_power_total
    name: PV power
    type: area
    color: "#f5b041"
    statistics:
      type: mean
      period: 5minute
    extend_to: false
    show:
      legend_value: true
      in_header: raw
  - entity: sensor.ac_power
    name: AC power
    type: area
    color: "#00aaff"
    extend_to: false
    statistics:
      type: mean
      period: 5minute
    show:
      legend_value: true
      in_header: raw
  - entity: sensor.grid_power
    name: Grid power
    type: area
    color: "#a83232"
    extend_to: false
    statistics:
      type: mean
      period: 5minute
    show:
      legend_value: true
      in_header: raw
